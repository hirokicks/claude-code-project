<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太陽系 — Scroll Camera Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --panel-bg: rgba(8, 12, 30, 0.88);
  }

  html { font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; }

  /* ── Scroll driver ── */
  #scroll-driver { height: 800vh; }

  /* ── Fixed stage ── */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
  }

  /* ── Camera wrap — transform target ── */
  #bg-wrap {
    position: absolute;
    inset: 0;
    will-change: transform;
    transform-origin: center center;
    /* NO CSS transition — JS rAF drives all motion */
  }

  /* ── bg-scene: 2× viewport, centered in bg-wrap ── */
  #bg-scene {
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: #000;
  }

  /* Canvas fills bg-scene */
  #space-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ── SVG hotspot overlay: same size/position as bg-scene ── */
  #hotspot-svg {
    position: absolute;
    left: -50%;
    top: -50%;
    width: 200%;
    height: 200%;
    pointer-events: none;
    overflow: visible;
  }

  /* Hotspot styles */
  .hs-ring {
    fill: none;
    stroke-width: 3;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .hs-ring.active {
    opacity: 1;
    animation: pulse-ring 2.4s ease-in-out infinite;
  }
  .hs-ring-outer {
    fill: none;
    stroke-width: 1.5;
    opacity: 0;
    transition: opacity 0.5s ease;
    stroke-dasharray: 8 6;
  }
  .hs-ring-outer.active {
    opacity: 0.5;
    animation: rotate-dash 12s linear infinite;
  }
  .hs-dot {
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .hs-dot.active { opacity: 1; }
  .hs-label {
    font-size: 28px;
    font-weight: 600;
    font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  .hs-label.active { opacity: 0.9; }

  @keyframes pulse-ring {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(1.12); }
  }
  @keyframes rotate-dash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -200; }
  }

  /* ── Vignette ── */
  #vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 80% at 50% 50%,
      transparent 35%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 10;
  }

  /* ── Info panel ── */
  #info-panel {
    position: fixed;
    right: 36px;
    top: 50%;
    transform: translateY(-50%) translateX(140%);
    width: 300px;
    background: var(--panel-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255,255,255,0.05);
    z-index: 100;
    transition: transform 0.85s var(--ease-out-expo), opacity 0.6s ease;
    opacity: 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
  }
  #info-panel.visible {
    transform: translateY(-50%) translateX(0);
    opacity: 1;
  }

  .panel-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
  }
  .panel-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
  }
  .panel-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 6px;
    color: #fff;
  }
  .panel-sub {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
    margin-bottom: 14px;
  }
  .panel-desc {
    font-size: 13px;
    line-height: 1.85;
    color: rgba(255,255,255,0.7);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 14px;
    margin-bottom: 16px;
  }
  .panel-stats {
    display: flex;
    gap: 8px;
  }
  .stat-item {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
  }
  .stat-num {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .stat-label {
    font-size: 9.5px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* ── Section title ── */
  #section-title {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%) translateY(28px);
    text-align: center;
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s var(--ease-out-expo);
    z-index: 100;
    pointer-events: none;
  }
  #section-title.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #section-title .en {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  #section-title .ja {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,0.8);
  }

  /* ── Progress nav ── */
  #progress-nav {
    position: fixed;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 100;
  }
  .nav-dot {
    position: relative;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    cursor: pointer;
    transition: all 0.35s ease;
  }
  .nav-dot::after {
    content: attr(data-label);
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    white-space: nowrap;
    color: rgba(255,255,255,0);
    transition: color 0.25s ease;
  }
  .nav-dot:hover::after { color: rgba(255,255,255,0.7); }
  .nav-dot.active {
    background: #fff;
    transform: scale(1.6);
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  /* ── Hero ── */
  #hero {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #hero .h-en {
    font-size: 10px;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  #hero .h-ja {
    font-size: 46px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 60px rgba(100,160,255,0.4);
    line-height: 1.15;
    text-align: center;
    letter-spacing: 0.04em;
  }
  #hero .h-sub {
    margin-top: 22px;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.9;
  }

  /* ── Scroll hint ── */
  #scroll-hint {
    position: fixed;
    bottom: 28px;
    right: 36px;
    color: rgba(255,255,255,0.35);
    font-size: 10px;
    letter-spacing: 0.18em;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: opacity 0.5s ease;
  }
  #scroll-hint::before {
    content: '';
    width: 1px; height: 44px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4));
    animation: drip 1.8s ease-in-out infinite;
  }
  @keyframes drip {
    0%   { transform: scaleY(0) translateY(-22px); opacity: 0; }
    40%  { transform: scaleY(1) translateY(0);     opacity: 1; }
    100% { transform: scaleY(0) translateY(22px);  opacity: 0; }
  }

  /* ── Orbit info strip (top) ── */
  #orbit-strip {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px;
    padding: 6px 16px;
    z-index: 100;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #orbit-strip.visible { opacity: 1; }
  #orbit-dist { color: rgba(255,255,255,0.8); font-weight: 600; }
</style>
</head>
<body>

<!-- ── Stage ── -->
<div id="stage">

  <!-- Camera wrap -->
  <div id="bg-wrap">

    <!-- Background scene (2× viewport) -->
    <div id="bg-scene">
      <canvas id="space-canvas"></canvas>
    </div>

    <!-- SVG hotspots (same size/position as bg-scene, viewBox = canvas px) -->
    <svg id="hotspot-svg" viewBox="0 0 3200 2000" preserveAspectRatio="xMidYMid meet">

      <!-- Mercury -->
      <g id="hs-mercury">
        <circle class="hs-ring-outer" cx="1180" cy="995" r="80"
          stroke="#aaa"/>
        <circle class="hs-ring" cx="1180" cy="995" r="52"
          stroke="#cccccc"/>
        <circle class="hs-dot" cx="1180" cy="995" r="16" fill="#ccc"/>
        <text class="hs-label" x="1215" y="970" fill="#ccc">水星</text>
      </g>

      <!-- Venus -->
      <g id="hs-venus">
        <circle class="hs-ring-outer" cx="1360" cy="1005" r="90"
          stroke="#e8c87a"/>
        <circle class="hs-ring" cx="1360" cy="1005" r="60"
          stroke="#e8c87a"/>
        <circle class="hs-dot" cx="1360" cy="1005" r="20" fill="#e8c87a"/>
        <text class="hs-label" x="1398" y="975" fill="#e8c87a">金星</text>
      </g>

      <!-- Earth -->
      <g id="hs-earth">
        <circle class="hs-ring-outer" cx="1550" cy="995" r="95"
          stroke="#4fc3f7"/>
        <circle class="hs-ring" cx="1550" cy="995" r="64"
          stroke="#4fc3f7"/>
        <circle class="hs-dot" cx="1550" cy="995" r="22" fill="#4fc3f7"/>
        <text class="hs-label" x="1590" y="965" fill="#4fc3f7">地球</text>
      </g>

      <!-- Mars -->
      <g id="hs-mars">
        <circle class="hs-ring-outer" cx="1740" cy="1005" r="80"
          stroke="#ef5350"/>
        <circle class="hs-ring" cx="1740" cy="1005" r="54"
          stroke="#ef5350"/>
        <circle class="hs-dot" cx="1740" cy="1005" r="17" fill="#ef5350"/>
        <text class="hs-label" x="1778" y="975" fill="#ef5350">火星</text>
      </g>

      <!-- Jupiter -->
      <g id="hs-jupiter">
        <circle class="hs-ring-outer" cx="2050" cy="990" r="150"
          stroke="#d4956a"/>
        <circle class="hs-ring" cx="2050" cy="990" r="104"
          stroke="#d4956a"/>
        <circle class="hs-dot" cx="2050" cy="990" r="30" fill="#d4956a"/>
        <text class="hs-label" x="2096" y="955" fill="#d4956a">木星</text>
      </g>

      <!-- Saturn -->
      <g id="hs-saturn">
        <circle class="hs-ring-outer" cx="2420" cy="1010" r="170"
          stroke="#c8b560"/>
        <circle class="hs-ring" cx="2420" cy="1010" r="120"
          stroke="#c8b560"/>
        <circle class="hs-dot" cx="2420" cy="1010" r="28" fill="#c8b560"/>
        <text class="hs-label" x="2465" y="975" fill="#c8b560">土星</text>
      </g>

    </svg>

  </div><!-- /bg-wrap -->

  <!-- Vignette -->
  <div id="vignette"></div>

  <!-- Hero overlay -->
  <div id="hero">
    <div class="h-en">Solar System — Scroll Experience</div>
    <div class="h-ja">宇宙を旅する</div>
    <div class="h-sub">スクロールして各惑星へ<br>カメラが宇宙を航行します</div>
  </div>

  <!-- Section title -->
  <div id="section-title">
    <div class="en" id="title-en"></div>
    <div class="ja" id="title-ja"></div>
  </div>

  <!-- Progress nav -->
  <div id="progress-nav">
    <div class="nav-dot active" data-section="0" data-label="太陽系"></div>
    <div class="nav-dot" data-section="1" data-label="水星"></div>
    <div class="nav-dot" data-section="2" data-label="金星"></div>
    <div class="nav-dot" data-section="3" data-label="地球"></div>
    <div class="nav-dot" data-section="4" data-label="火星"></div>
    <div class="nav-dot" data-section="5" data-label="木星"></div>
    <div class="nav-dot" data-section="6" data-label="土星"></div>
  </div>

  <!-- Orbit strip -->
  <div id="orbit-strip">
    太陽からの距離 &nbsp;<span id="orbit-dist">—</span>
  </div>

  <!-- Info panel -->
  <div id="info-panel">
    <div class="panel-tag" id="panel-tag">
      <span class="panel-dot" id="panel-dot"></span>
      <span id="panel-tag-text"></span>
    </div>
    <div class="panel-title" id="panel-title"></div>
    <div class="panel-sub" id="panel-sub"></div>
    <div class="panel-desc" id="panel-desc"></div>
    <div class="panel-stats" id="panel-stats"></div>
  </div>

  <!-- Scroll hint -->
  <div id="scroll-hint">SCROLL</div>

</div><!-- /stage -->

<!-- Scroll driver -->
<div id="scroll-driver"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CANVAS: Solar System Renderer
// ═══════════════════════════════════════════════════════════════════════════════

const CANVAS_W = 3200;
const CANVAS_H = 2000;

// Planet data (canvas pixel coords on CANVAS_W × CANVAS_H)
const PLANETS = {
  sun:     { x: 1000, y: 1000, r: 100 },
  mercury: { x: 1180, y: 995,  r:   8 },
  venus:   { x: 1360, y: 1005, r:  14 },
  earth:   { x: 1550, y: 995,  r:  16 },
  mars:    { x: 1740, y: 1005, r:  11 },
  jupiter: { x: 2050, y: 990,  r:  42 },
  saturn:  { x: 2420, y: 1010, r:  33 },
};

function initCanvas() {
  const canvas = document.getElementById('space-canvas');
  canvas.width  = CANVAS_W;
  canvas.height = CANVAS_H;
  const ctx = canvas.getContext('2d');
  drawSpace(ctx);
}

/* ── Seeded PRNG (Mulberry32) ── */
function makePRNG(seed) {
  let s = seed;
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function drawSpace(ctx) {
  const W = CANVAS_W, H = CANVAS_H;
  const rand = makePRNG(42);

  // ── 1. Deep space background ──
  const bg = ctx.createRadialGradient(W*0.4, H*0.5, 0, W*0.5, H*0.5, W*0.7);
  bg.addColorStop(0,   '#0a0d1f');
  bg.addColorStop(0.5, '#050810');
  bg.addColorStop(1,   '#000000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── 2. Nebula / galactic clouds ──
  const nebulas = [
    { x: W*0.18, y: H*0.28, rx: W*0.25, ry: H*0.30, color: 'rgba(60,30,120,0.07)' },
    { x: W*0.72, y: H*0.60, rx: W*0.30, ry: H*0.28, color: 'rgba(20,60,120,0.06)' },
    { x: W*0.45, y: H*0.75, rx: W*0.28, ry: H*0.22, color: 'rgba(80,20,80,0.05)'  },
    { x: W*0.85, y: H*0.25, rx: W*0.20, ry: H*0.28, color: 'rgba(10,80,100,0.06)' },
  ];
  nebulas.forEach(n => {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, Math.max(n.rx, n.ry));
    g.addColorStop(0,   n.color);
    g.addColorStop(0.6, n.color.replace(/[\d.]+\)$/, '0.02)'));
    g.addColorStop(1,   'transparent');
    ctx.save();
    ctx.scale(1, n.ry / n.rx);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y * (n.rx/n.ry), n.rx, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // ── 3. Stars ──
  // Category: [count, minR, maxR, minAlpha, maxAlpha]
  const starCats = [
    [1600, 0.4, 0.8,  0.25, 0.65],
    [ 350, 0.8, 1.4,  0.50, 0.90],
    [  60, 1.4, 2.2,  0.75, 1.00],
    [  12, 2.2, 3.0,  0.90, 1.00],
  ];
  starCats.forEach(([count, rMin, rMax, aMin, aMax]) => {
    for (let i = 0; i < count; i++) {
      const sx = rand() * W;
      const sy = rand() * H;
      const sr = rMin + rand() * (rMax - rMin);
      const sa = aMin + rand() * (aMax - aMin);
      const hue = rand() < 0.15 ? (rand() < 0.5 ? 210 : 30) : 0; // some blue/orange tint
      const sat = hue ? '60%' : '0%';
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},${sat},100%,${sa})`;
      ctx.fill();
    }
  });

  // ── 4. Orbit rings ──
  const SUN = PLANETS.sun;
  const orbitPlanets = ['mercury','venus','earth','mars','jupiter','saturn'];
  orbitPlanets.forEach(name => {
    const p = PLANETS[name];
    const r = Math.hypot(p.x - SUN.x, p.y - SUN.y);
    ctx.beginPath();
    ctx.arc(SUN.x, SUN.y, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.055)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // ── 5. Asteroid belt ──
  const beltInner = Math.hypot(PLANETS.mars.x    - SUN.x, 0) + 70;
  const beltOuter = Math.hypot(PLANETS.jupiter.x - SUN.x, 0) - 80;
  const astRand = makePRNG(999);
  for (let i = 0; i < 280; i++) {
    const angle = astRand() * Math.PI * 2;
    const dist  = beltInner + astRand() * (beltOuter - beltInner);
    const bx = SUN.x + Math.cos(angle) * dist;
    const by = SUN.y + Math.sin(angle) * dist;
    const br = 0.8 + astRand() * 2.0;
    const ba = 0.2 + astRand() * 0.5;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI*2);
    ctx.fillStyle = `rgba(180,170,160,${ba})`;
    ctx.fill();
  }

  // ── 6. Sun ──
  ;(function drawSun() {
    const { x, y, r } = SUN;
    // Corona glow layers
    [[r*8, 0.02], [r*5, 0.05], [r*3.2, 0.10], [r*2, 0.20]].forEach(([gr, ga]) => {
      const g = ctx.createRadialGradient(x, y, r*0.5, x, y, gr);
      g.addColorStop(0, `rgba(255,220,100,${ga})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, gr, 0, Math.PI*2);
      ctx.fill();
    });
    // Corona rays (subtle)
    ctx.save();
    for (let i = 0; i < 12; i++) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(i * Math.PI / 6);
      const rg = ctx.createLinearGradient(0, 0, r*6, 0);
      rg.addColorStop(0,   'rgba(255,200,80,0.08)');
      rg.addColorStop(0.4, 'rgba(255,180,60,0.03)');
      rg.addColorStop(1,   'transparent');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(r*0.9, -r*0.12);
      ctx.lineTo(r*6,   0);
      ctx.lineTo(r*0.9, +r*0.12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    // Main sphere
    const sg = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.05, x, y, r);
    sg.addColorStop(0,   '#fff8e0');
    sg.addColorStop(0.25,'#ffd966');
    sg.addColorStop(0.6, '#ff9900');
    sg.addColorStop(0.85,'#e05500');
    sg.addColorStop(1,   '#7a1a00');
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fillStyle = sg;
    ctx.fill();
    // Surface shimmer
    for (let i = 0; i < 6; i++) {
      const sx = x + (rand()*2-1)*r*0.6;
      const sy = y + (rand()*2-1)*r*0.6;
      const sr2 = r*0.08 + rand()*r*0.15;
      const flg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr2);
      flg.addColorStop(0, 'rgba(255,250,220,0.18)');
      flg.addColorStop(1, 'transparent');
      ctx.fillStyle = flg;
      ctx.beginPath();
      ctx.arc(sx, sy, sr2, 0, Math.PI*2);
      ctx.fill();
    }
  })();

  // ── 7. Planets ──
  function drawPlanet(name, drawFn) {
    const p = PLANETS[name];

    ctx.restore();

  // Mercury
  drawPlanet('mercury', (c, r) => {
    const g = c.createRadialGradient(-r*0.3,-r*0.3, r*0.05, 0, 0, r);

    g.addColorStop(0.5, '#9e9e9e');
    g.addColorStop(1,   '#5a5a5a');
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2);
    c.fillStyle = g; c.fill();
    // craters
    [[r*0.3, r*0.1, r*0.12],[-r*0.2, r*0.2, r*0.08],[-r*0.3,-r*0.2,r*0.06]].forEach(([cx,cy,cr]) => {

  // Venus
  drawPlanet('venus', (c, r) => {
    const g = c.createRadialGradient(-r*0.3,-r*0.3, r*0.05, 0, 0, r);

    // cloud bands

      c.clip();
      c.beginPath();

  // Earth
  drawPlanet('earth', (c, r) => {
    // Ocean

    g.addColorStop(0,   '#7adcff');
    g.addColorStop(0.5, '#1e88e5');
    g.addColorStop(1,   '#0a3a6e');
    c.beginPath(); c.arc(0,0,r,0,Math.PI*2); c.fillStyle = g; c.fill();
    // Continents (rough blobs)
    c.save(); c.clip();
    const lands = [
      {x:-r*0.1, y:-r*0.2, rx:r*0.45, ry:r*0.35, rot: 0.3},
      {x: r*0.3, y: r*0.1,  rx:r*0.25, ry:r*0.45, rot:-0.4},
      {x:-r*0.5, y: r*0.2,  rx:r*0.18, ry:r*0.20, rot: 0.1},
    ];
    lands.forEach(l => {
      c.save();
      c.translate(l.x, l.y); c.rotate(l.rot);
      c.beginPath(); c.ellipse(0, 0, l.rx, l.ry, 0, 0, Math.PI*2);
      c.fillStyle = 'rgba(56,142,60,0.75)'; c.fill();

    c.beginPath(); c.ellipse(0, -r*0.85, r*0.5, r*0.22, 0, 0, Math.PI*2);

    c.beginPath(); c.ellipse(0,  r*0.88, r*0.35, r*0.15, 0, 0, Math.PI*2);

    // Cloud wisps
    c.globalAlpha = 0.35;
    [{x:-r*0.2,y:-r*0.1,w:r*0.7,h:r*0.1},{x:r*0.1,y:r*0.3,w:r*0.55,h:r*0.08}].forEach(cl => {

    // Atmosphere rim

    atm.addColorStop(0.6, 'rgba(60,130,220,0.06)');
    atm.addColorStop(1,   'transparent');

  // Mars

    rs.addColorStop(0, 'rgba(80,60,10,0.25)');

  ctx.save();

}

//  SECTIONS: Camera targets + UI data
//  Camera formula: tx = -scale * (2 * pctX - 100)
//  where pctX = (canvasX / CANVAS_W) * 100
// ═══════════════════════════════════════════════════════════════════════════════

function cam(cx, cy, scale) {
  const px = (cx / CANVAS_W) * 100;
  const py = (cy / CANVAS_H) * 100;
  return {
    x:     -scale * (2 * px - 100),
    y:     -scale * (2 * py - 100),
    scale,
  };
}

// ═══════════════════════════════════════════════════════════════════════════════
//  CAMERA ENGINE: rAF lerp loop
// ═══════════════════════════════════════════════════════════════════════════════

const LERP = 0.07;   // smoothness factor

let targetCam  = { ...sections[0].camera };
let currentCam = { ...sections[0].camera };
let rawProgress = 0;         // 0 … sections.length-1
let currentSectionIdx = 0;

function lerp(a, b, t) { return a + (b - a) * t; }

function smoothstep(t) {
  const c = Math.max(0, Math.min(1, t));
  return c * c * (3 - 2 * c);
}

function calcTargetCamera(raw) {
  const maxIdx = sections.length - 1;
  const clamped = Math.max(0, Math.min(maxIdx, raw));
  const fromIdx = Math.min(Math.floor(clamped), maxIdx - 1);
  const toIdx   = fromIdx + 1;
  const t       = smoothstep(clamped - fromIdx);
  const A = sections[fromIdx].camera;
  const B = sections[toIdx].camera;
  return {
    x:     lerp(A.x,     B.x,     t),
    y:     lerp(A.y,     B.y,     t),
    scale: lerp(A.scale, B.scale, t),
  };
}

function updatePanel(s) {
  if (!s.panel) {
    infoPanel.classList.remove('visible');
    return;
  }
  const p = s.panel;
  panelTag.textContent   = p.tag;
  panelDot.style.background = p.dotColor;
  document.getElementById('panel-tag').style.background = p.tagColor;
  document.getElementById('panel-tag').style.color      = p.tagTextColor;
  panelTitle.textContent = p.title;
  panelSub.textContent   = p.sub;
  panelDesc.textContent  = p.desc;
  panelStats.innerHTML   = p.stats.map(st =>
    `<div class="stat-item"><div class="stat-num">${st.num}</div><div class="stat-label">${st.label}</div></div>`
  ).join('');
  requestAnimationFrame(() => infoPanel.classList.add('visible'));
}

// ── Section UI update ──
function onSectionChange(idx) {
  currentSectionIdx = idx;
  const s = sections[idx];

  hero.style.opacity       = idx === 0 ? '1' : '0';
  hero.style.pointerEvents = idx === 0 ? 'auto' : 'none';

  scrollHint.style.opacity = idx === sections.length - 1 ? '0' : '1';

  setActiveArea(s.area);

  infoPanel.classList.remove('visible');
  setTimeout(() => updatePanel(s), 380);

  secTitle.classList.remove('visible');
  titleEnEl.textContent = s.titleEn;
  titleJaEl.textContent = s.titleJa;
  if (s.titleJa) setTimeout(() => secTitle.classList.add('visible'), 300);

  navDots.forEach((d, i) => d.classList.toggle('active', i === idx));

  orbitDist.textContent = s.orbitDist || '—';
  if (idx > 0) orbitStrip.classList.add('visible');
  else         orbitStrip.classList.remove('visible');
}

// ── Scroll → rawProgress ──
window.addEventListener('scroll', () => {
  const max = scrollDrv.offsetHeight - window.innerHeight;
  rawProgress = max > 0
    ? (window.scrollY / max) * (sections.length - 1)
    : 0;
}, { passive: true });

// ── rAF tick ──
function tick() {
  targetCam = calcTargetCamera(rawProgress);

  currentCam.x     = lerp(currentCam.x,     targetCam.x,     LERP);
  currentCam.y     = lerp(currentCam.y,     targetCam.y,     LERP);
  currentCam.scale = lerp(currentCam.scale, targetCam.scale, LERP);

  bgWrap.style.transform =
    `translate(${currentCam.x}%, ${currentCam.y}%) scale(${currentCam.scale})`;

  const newIdx = Math.min(sections.length - 1, Math.round(rawProgress));
  if (newIdx !== currentSectionIdx) onSectionChange(newIdx);

  requestAnimationFrame(tick);
}

// ── Nav dot click ──
navDots.forEach(dot => {
  dot.addEventListener('click', () => {
    const idx = parseInt(dot.dataset.section, 10);
    const max = scrollDrv.offsetHeight - window.innerHeight;
    window.scrollTo({ top: (idx / (sections.length - 1)) * max, behavior: 'smooth' });
  });
});

// ── Init ──
initCanvas();
onSectionChange(0);
requestAnimationFrame(tick);
</script>
</body>
</html>
