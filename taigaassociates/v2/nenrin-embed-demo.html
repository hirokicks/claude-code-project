<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年輪アート 組み込みデモ v2 / TAIGA ASSOCIATES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
    background: #ffffff; color: #2c2925;
  }

  /* この art-block が、実際のページ内で使う想定のブロック単位 */
  .art-block { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .art-block canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .art-copy {
    position: absolute; left: 0; bottom: 0;
    padding: 0 clamp(20px, 3vw, 26px) clamp(20px, 3vw, 26px);
    pointer-events: none; z-index: 2;
    display: flex; flex-direction: column; gap: 12px;
    font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont,
                 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
  }
  .art-copy h2 { font-size: clamp(36px, 6vw, 64px); font-weight: 300; line-height: 1; letter-spacing: -.01em; }
  .art-copy p  { font-size: clamp(15px, 2.2vw, 24px); font-weight: 500; line-height: 1.4; }

  .panel {
    position: fixed; right: 24px; bottom: 24px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;
    background: rgba(20,19,17,.88); color: #eee; padding: 10px 14px; border-radius: 999px;
    z-index: 10; font-size: 12px; letter-spacing: .04em;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
  }
  .panel button {
    font: inherit; color: #eee; background: #333130; border: 1px solid #4a4745;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .panel button:hover { background: #444140; }
  .panel button[aria-current="true"] { background: #eee; color: #1a1917; border-color: #eee; }
  .panel .mode { opacity: .65; min-width: 150px; text-align: center; }
</style>
</head>
<body>

<div class="art-block" id="block">
  <canvas id="art"></canvas>
  <div class="art-copy">
    <h2 id="headline">Discover New Way</h2>
    <p id="subline">新しい価値を紡ぐ</p>
  </div>
</div>

<div class="panel">
  <button data-key="section">断面 / Section</button>
  <button data-key="tint">彩 / Tint</button>
  <button data-key="heart">ハート / Heart</button>
  <span class="mode" id="mode">—</span>
</div>

<script src="nenrin-runtime.js"></script>
<script>
(function () {
  "use strict";

  // 中心アイコンは SVG から変換して設定に入れます。テスターから書き出した
  // 設定には変換済みの文字列（icon: 'M0 1 L...'）がそのまま入っているので、
  // 通常この変換は不要です。ここでは svgToIcon の使い方を示すために実行時に変換しています。
  var HEART = NenrinArt.svgToIcon(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
  );

  // 構造パラメータ（ringCount / segments / spiralBlend / spacingVarFreq /
  // seed / icon）が同じ2枚は「モーフ」で形そのものが連続変形します。
  // 記載のない項目は NenrinArt.defaultConfig() の既定値です。
  var CONFIGS = {
    // --- A: 樹木の断面 ---
    section: {},

    // --- B: A と構造は同一、色とうねりだけ違う → モーフで繋がる ---
    tint: {
      bgColor: '#eef2f6', textColor: '#1f3a63', color: '#3a5f8a',
      lineWidth: 3.2, lineWidthInner: 0.3, outlineAmt: 105, outlineGrowth: 1.8
    },

    // --- C: 中心にアイコン。icon は構造パラメータなので強制モーフで繋ぐ ---
    heart: {
      icon: HEART, scale: 0.88, baseRadius: 95, ringCount: 34, spacing: 9.5,
      lineWidth: 5.5, lineWidthInner: 0.12, outlineAmt: 55, outlineFreq: 1.4,
      outlineGrowth: 2.2, irregAmt: 0.4
    }
  };

  var COPY = {
    section: ['Discover New Way', '新しい価値を紡ぐ'],
    tint:    ['Grow Together',    '共に育つ'],
    heart:   ['From the Heart',   '想いを中心に']
  };

  // --- 起動 ---
  var current = 'section';
  var art = NenrinArt.create(document.getElementById('art'), CONFIGS.section);

  var headline = document.getElementById('headline');
  var subline = document.getElementById('subline');
  var modeEl = document.getElementById('mode');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.panel button'));

  function syncButtons() {
    buttons.forEach(function (b) {
      b.setAttribute('aria-current', String(b.dataset.key === current));
    });
  }

  var MODE_LABEL = { morph: 'モーフ', forced: '強制モーフ', crossfade: 'クロスフェード' };

  function go(key) {
    if (key === current || art.isTransitioning()) return;
    var mode = art.transitionTo(CONFIGS[key], {
      duration: 1400,
      easing: 'easeInOutCubic',
      // 構造が違っても、ほぼ全編モーフで繋ぐ
      force: true,
      // 位置と大きさは動かさず、形の変化だけを見せる
      stage: false,
      onComplete: function () { modeEl.textContent = MODE_LABEL[mode] + ' 完了'; }
    });
    modeEl.textContent = '⟶ ' + MODE_LABEL[mode] + '中';
    current = key;
    syncButtons();
    headline.textContent = COPY[key][0];
    subline.textContent = COPY[key][1];
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.key); });
  });
  syncButtons();

  // 文字色と背景は state を毎フレーム反映（遷移中も補間される）
  (function tick() {
    document.querySelector('.art-copy').style.color = art.state.textColor;
    document.body.style.background = art.state.bgColor;
    requestAnimationFrame(tick);
  })();

  // デバッグ／検証用
  window.demo = { art: art, configs: CONFIGS, go: go };
})();
</script>
</body>
</html>
