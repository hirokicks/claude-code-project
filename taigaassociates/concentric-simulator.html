<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concentric Shape Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Sidebar --- */
  #sidebar {
    width: 320px;
    min-width: 280px;
    background: #1a1a1a;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar-header {
    padding: 18px 16px 12px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #sidebar-header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
  }

  #sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Global controls */
  #global-controls {
    background: #222;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
  }

  #global-controls h2 {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }

  /* Shape upload */
  #shape-upload-section {
    background: #222;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #shape-upload-section h2 {
    font-size: 11px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .shape-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2a2a2a;
    border-radius: 6px;
    padding: 8px;
  }

  .shape-preview {
    width: 36px;
    height: 36px;
    background: #333;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .shape-preview svg {
    width: 28px;
    height: 28px;
  }

  .shape-name {
    flex: 1;
    font-size: 12px;
    color: #ccc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-icon {
    width: 24px;
    height: 24px;
    background: none;
    border: none;
    color: #666;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-size: 14px;
    flex-shrink: 0;
  }
  .btn-icon:hover { background: #333; color: #ccc; }

  /* Upload drop zone */
  #drop-zone {
    border: 1px dashed #3a3a3a;
    border-radius: 6px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    color: #555;
    font-size: 12px;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: #5a7fff;
    color: #5a7fff;
    background: rgba(90,127,255,0.05);
  }

  /* Layer cards */
  .layer-card {
    background: #222;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2a2a2a;
  }

  .layer-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
    background: #252525;
  }
  .layer-header:hover { background: #2a2a2a; }

  .layer-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .layer-title {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    color: #ccc;
  }

  .layer-toggle {
    font-size: 10px;
    color: #555;
    transition: transform 0.2s;
  }
  .layer-toggle.open { transform: rotate(180deg); }

  .layer-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-top: 1px solid #2a2a2a;
  }
  .layer-body.hidden { display: none; }

  /* Form controls */
  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .control-label {
    font-size: 11px;
    color: #777;
    width: 90px;
    flex-shrink: 0;
  }

  .control-value {
    font-size: 11px;
    color: #aaa;
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }

  input[type="range"] {
    flex: 1;
    height: 4px;
    accent-color: #5a7fff;
    cursor: pointer;
  }

  input[type="number"] {
    width: 60px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    color: #ccc;
    font-size: 11px;
    padding: 3px 6px;
    outline: none;
  }
  input[type="number"]:focus { border-color: #5a7fff; }

  /* Compact number input synced with sliders */
  .num-input {
    width: 54px !important;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    color: #ccc;
    font-size: 11px;
    padding: 2px 4px;
    text-align: right;
    outline: none;
    flex-shrink: 0;
  }
  .num-input:focus { border-color: #5a7fff; }
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button { opacity: 0.4; width: 12px; }

  .control-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-block input[type="range"] {
    margin: 0;
  }
  .auto-label {
    font-size: 11px;
    color: #555;
    width: 24px;
  }

  select {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    color: #ccc;
    font-size: 11px;
    padding: 4px 6px;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: #5a7fff; }

  .control-divider {
    height: 1px;
    background: #2a2a2a;
    margin: 2px 0;
  }

  /* Color swatch */
  input[type="color"] {
    width: 28px;
    height: 22px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
    background: none;
  }

  /* Toggle switch */
  .toggle-switch {
    position: relative;
    width: 32px;
    height: 18px;
    flex-shrink: 0;
  }
  .toggle-switch input { display: none; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    background: #666;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle-switch input:checked + .toggle-slider { background: #2a4fff; }
  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(14px);
    background: #fff;
  }

  /* Add layer button */
  #add-layer-btn {
    width: 100%;
    padding: 10px;
    background: #222;
    border: 1px dashed #3a3a3a;
    border-radius: 8px;
    color: #555;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #add-layer-btn:hover {
    border-color: #5a7fff;
    color: #5a7fff;
    background: rgba(90,127,255,0.05);
  }

  /* --- Canvas --- */
  #canvas-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #toolbar {
    padding: 10px 16px;
    border-bottom: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .toolbar-label {
    font-size: 11px;
    color: #555;
  }

  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .btn-primary {
    background: #5a7fff;
    color: #fff;
  }
  .btn-primary:hover { background: #6e8fff; }

  .btn-ghost {
    background: transparent;
    border: 1px solid #3a3a3a;
    color: #888;
  }
  .btn-ghost:hover { border-color: #5a5a5a; color: #ccc; }

  #canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #141414;
    position: relative;
  }

  #main-canvas {
    display: block;
  }

  #bg-toggle-label {
    font-size: 11px;
    color: #555;
    margin-left: auto;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* Animation controls */
  #anim-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .speed-badge {
    font-size: 10px;
    background: #2a2a2a;
    padding: 2px 6px;
    border-radius: 4px;
    color: #888;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>Concentric Simulator</h1>
  </div>

  <div id="sidebar-scroll">

    <!-- Global controls -->
    <div id="global-controls">
      <h2>Global</h2>
      <div class="control-row">
        <span class="control-label">Canvas size</span>
        <input type="number" id="canvas-w" value="800" min="200" max="2000" step="50">
        <span style="font-size:11px;color:#555">×</span>
        <input type="number" id="canvas-h" value="800" min="200" max="2000" step="50">
      </div>
      <div class="control-row">
        <span class="control-label">BG color</span>
        <input type="color" id="bg-color" value="#ffffff">
        <span class="control-label" style="width:auto;margin-left:8px">Shape color</span>
        <input type="color" id="shape-color" value="#000000">
      </div>
    </div>

    <!-- Shape upload -->
    <div id="shape-upload-section">
      <h2>Shapes</h2>
      <div id="shapes-list"></div>
      <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        + SVGをアップロード
      </div>
      <input type="file" id="file-input" accept=".svg" multiple style="display:none">
    </div>

    <!-- Layers -->
    <div id="layers-container"></div>
    <button id="add-layer-btn">+ Add Layer</button>

  </div>
</div>

<!-- Canvas area -->
<div id="canvas-area">
  <div id="toolbar">
    <div id="anim-controls">
      <button class="btn btn-ghost" id="play-btn">▶ Play</button>
      <div class="control-row" style="gap:6px">
        <span class="toolbar-label">Speed</span>
        <input type="range" id="anim-speed" min="0.1" max="5" step="0.1" value="1" style="width:80px">
        <span class="speed-badge" id="speed-label">1.0×</span>
      </div>
    </div>
    <span style="flex:1"></span>
    <button class="btn btn-ghost" id="export-png-btn">PNG</button>
    <button class="btn btn-primary" id="export-btn">↓ SVG</button>
  </div>
  <div id="canvas-container">
    <svg id="main-canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
const state = {
  canvasW: 800,
  canvasH: 800,
  bgColor: '#ffffff',
  shapeColor: '#000000',
  shapes: [],      // { id, name, svgContent, viewBox }
  layers: [],      // layer objects
  animating: false,
  animSpeed: 1.0,
  animFrameId: null,
  animTime: 0,
  lastTimestamp: null,
};

// ============================================================
// Layer factory
// ============================================================
let layerIdCounter = 0;

const LAYER_COLORS = ['#5a7fff','#ff6b6b','#ffd166','#06d6a0','#c77dff','#ff9f1c'];

function createLayer(index) {
  const id = ++layerIdCounter;
  const count = 8 + index * 2;
  const radius = 80 + index * 80;
  return {
    id,
    visible: true,
    shapeId: null,         // which shape to use (null = default pill)
    count,
    radius,
    startAngle: 0,         // degrees offset
    autoStartAngle: true,
    itemRotation: 0,       // extra rotation of each item
    autoItemRotation: true,// tangent to circle
    scaleX: 1.0,
    scaleY: 1.0,
    autoScale: true,
    spacing: 1.0,          // multiplier on arc spacing (for auto count)
    animDir: 1,            // 1 or -1
    animSpeed: 1.0,
    color: null,           // null = use global
    open: true,
  };
}

// ============================================================
// Pill SVG (default shape)
// ============================================================
const DEFAULT_PILL_SVG = `<rect x="-6" y="-14" width="12" height="28" rx="6" ry="6"/>`;
const DEFAULT_PILL_VIEWBOX = '-8 -16 16 32';

// ============================================================
// DOM helpers
// ============================================================
const $ = id => document.getElementById(id);

function makeSVGEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// ============================================================
// Render
// ============================================================
function render() {
  const svg = $('main-canvas');
  svg.innerHTML = '';
  svg.setAttribute('width', state.canvasW);
  svg.setAttribute('height', state.canvasH);
  svg.setAttribute('viewBox', `0 0 ${state.canvasW} ${state.canvasH}`);
  svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

  // Background
  const bg = makeSVGEl('rect', {
    x: 0, y: 0, width: state.canvasW, height: state.canvasH,
    fill: state.bgColor
  });
  svg.appendChild(bg);

  const cx = state.canvasW / 2;
  const cy = state.canvasH / 2;

  // Pre-compute normalized shape info (center + normalize to ~28px)
  const NORM_SIZE = 28;
  const shapeInfo = {};
  for (const sh of state.shapes) {
    const parts = sh.viewBox.split(/[\s,]+/).map(Number);
    const [vx, vy, vw, vh] = parts;
    const normScale = NORM_SIZE / Math.max(vw, vh, 1);
    shapeInfo[sh.id] = { vx, vy, vw, vh, normScale };
  }

  // Layers
  for (const layer of state.layers) {
    if (!layer.visible) continue;

    const g = makeSVGEl('g', { id: `layer-${layer.id}` });
    svg.appendChild(g);

    const count = layer.count;
    const r = layer.radius;
    const baseAngle = (layer.startAngle + (state.animating ? state.animTime * layer.animDir * layer.animSpeed : 0)) * (Math.PI / 180);
    const fillColor = layer.color || state.shapeColor;

    const sh = layer.shapeId !== null ? state.shapes.find(s => s.id === layer.shapeId) : null;
    const si = sh ? shapeInfo[sh.id] : null;

    for (let i = 0; i < count; i++) {
      const angle = baseAngle + (2 * Math.PI * i / count);
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);

      // Base rotation = radial direction + offset, so all items have the same
      // orientation relative to the center regardless of their position on the circle.
      const radialDeg = angle * (180 / Math.PI);
      const rotOffset = layer.autoItemRotation ? 90 : layer.itemRotation;
      const itemRot = radialDeg + rotOffset;

      // Scale: auto = shrink as count increases
      let sx = layer.scaleX, sy = layer.scaleY;
      if (layer.autoScale) {
        const arcLen = (2 * Math.PI * r) / count;
        const base = 40;
        const s = Math.min(1.2, Math.max(0.2, arcLen / base));
        sx = s; sy = s;
      }

      const itemG = makeSVGEl('g', {
        transform: `translate(${x},${y}) rotate(${itemRot}) scale(${sx},${sy})`
      });

      if (sh && si) {
        // Inline SVG content, centered at origin and normalized to NORM_SIZE
        const centerX = si.vx + si.vw / 2;
        const centerY = si.vy + si.vh / 2;
        const innerG = makeSVGEl('g', {
          transform: `scale(${si.normScale}) translate(${-centerX},${-centerY})`,
          fill: fillColor
        });
        innerG.innerHTML = sh.svgContent;
        itemG.appendChild(innerG);
      } else {
        // Default pill
        itemG.innerHTML = DEFAULT_PILL_SVG;
        itemG.querySelector('rect').setAttribute('fill', fillColor);
      }

      g.appendChild(itemG);
    }
  }
}

// ============================================================
// Animation
// ============================================================
function startAnim() {
  if (state.animating) return;
  state.animating = true;
  state.lastTimestamp = null;
  $('play-btn').textContent = '⏸ Pause';
  loop();
}

function stopAnim() {
  state.animating = false;
  if (state.animFrameId) cancelAnimationFrame(state.animFrameId);
  $('play-btn').textContent = '▶ Play';
}

function loop(ts) {
  if (!state.animating) return;
  if (state.lastTimestamp !== null) {
    const dt = (ts - state.lastTimestamp) / 1000;
    state.animTime += dt * state.animSpeed * 30; // degrees/sec base
  }
  state.lastTimestamp = ts;
  render();
  state.animFrameId = requestAnimationFrame(loop);
}

// ============================================================
// Layer UI
// ============================================================
function buildLayerUI() {
  const container = $('layers-container');
  container.innerHTML = '';
  state.layers.forEach((layer, idx) => {
    const color = LAYER_COLORS[idx % LAYER_COLORS.length];
    const card = document.createElement('div');
    card.className = 'layer-card';
    card.dataset.layerId = layer.id;

    const shapeOptions = state.shapes.map(s =>
      `<option value="${s.id}" ${layer.shapeId === s.id ? 'selected' : ''}>${s.name}</option>`
    ).join('');

    card.innerHTML = `
      <div class="layer-header" onclick="toggleLayer(${layer.id})">
        <div class="layer-dot" style="background:${color}"></div>
        <span class="layer-title">Layer ${idx + 1}</span>
        <label class="toggle-switch" onclick="event.stopPropagation()">
          <input type="checkbox" ${layer.visible ? 'checked' : ''} onchange="setLayerProp(${layer.id},'visible',this.checked)">
          <span class="toggle-slider"></span>
        </label>
        <span class="layer-toggle ${layer.open ? 'open' : ''}">▼</span>
      </div>
      <div class="layer-body ${layer.open ? '' : 'hidden'}">
        <div class="control-row">
          <span class="control-label">Shape</span>
          <select onchange="setLayerProp(${layer.id},'shapeId', this.value === 'default' ? null : parseInt(this.value))">
            <option value="default" ${layer.shapeId === null ? 'selected' : ''}>Default pill</option>
            ${shapeOptions}
          </select>
        </div>
        <div class="control-divider"></div>
        <div class="control-row">
          <span class="control-label">Count</span>
          <input type="range" min="1" max="120" step="1" value="${layer.count}"
            oninput="setLayerProp(${layer.id},'count',parseInt(this.value));this.nextElementSibling.value=this.value">
          <input type="number" class="num-input" min="1" max="999" step="1" value="${layer.count}"
            onchange="(function(el){var v=Math.max(1,Math.min(999,parseInt(el.value)||1));el.value=v;el.previousElementSibling.value=Math.min(120,v);setLayerProp(${layer.id},'count',v)})(this)">
        </div>
        <div class="control-row">
          <span class="control-label">Radius</span>
          <input type="range" min="10" max="600" step="1" value="${layer.radius}"
            oninput="setLayerProp(${layer.id},'radius',parseInt(this.value));this.nextElementSibling.value=this.value">
          <input type="number" class="num-input" min="1" max="9999" step="1" value="${layer.radius}"
            onchange="(function(el){var v=Math.max(1,parseInt(el.value)||1);el.value=v;el.previousElementSibling.value=Math.min(600,v);setLayerProp(${layer.id},'radius',v)})(this)">
        </div>
        <div class="control-divider"></div>
        <div class="control-block">
          <div class="control-row">
            <span class="control-label">Start angle</span>
            <label class="toggle-switch">
              <input type="checkbox" ${layer.autoStartAngle ? 'checked' : ''}
                onchange="setLayerProp(${layer.id},'autoStartAngle',this.checked)">
              <span class="toggle-slider"></span>
            </label>
            <span class="auto-label">auto</span>
            <span style="flex:1"></span>
            <input type="number" class="num-input" min="-9999" max="9999" step="0.1" value="${layer.startAngle.toFixed(1)}"
              onchange="(function(el){var v=parseFloat(el.value)||0;el.value=v.toFixed(1);el.closest('.control-block').querySelector('input[type=range]').value=Math.min(360,Math.max(-360,v));setLayerProp(${layer.id},'startAngle',v);setLayerProp(${layer.id},'autoStartAngle',false)})(this)">
          </div>
          <input type="range" min="-360" max="360" step="0.1" value="${layer.startAngle}" style="width:100%"
            oninput="(function(el){var v=parseFloat(el.value);el.closest('.control-block').querySelector('.num-input').value=v.toFixed(1);setLayerProp(${layer.id},'startAngle',v);setLayerProp(${layer.id},'autoStartAngle',false)})(this)">
        </div>
        <div class="control-block">
          <div class="control-row">
            <span class="control-label">Item rotation</span>
            <label class="toggle-switch">
              <input type="checkbox" ${layer.autoItemRotation ? 'checked' : ''}
                onchange="setLayerProp(${layer.id},'autoItemRotation',this.checked)">
              <span class="toggle-slider"></span>
            </label>
            <span class="auto-label">auto</span>
            <span style="flex:1"></span>
            <input type="number" class="num-input" min="-9999" max="9999" step="0.1" value="${layer.itemRotation.toFixed(1)}"
              onchange="(function(el){var v=parseFloat(el.value)||0;el.value=v.toFixed(1);el.closest('.control-block').querySelector('input[type=range]').value=Math.min(180,Math.max(-180,v));setLayerProp(${layer.id},'itemRotation',v);setLayerProp(${layer.id},'autoItemRotation',false)})(this)">
          </div>
          <input type="range" min="-180" max="180" step="0.1" value="${layer.itemRotation}" style="width:100%"
            oninput="(function(el){var v=parseFloat(el.value);el.closest('.control-block').querySelector('.num-input').value=v.toFixed(1);setLayerProp(${layer.id},'itemRotation',v);setLayerProp(${layer.id},'autoItemRotation',false)})(this)">
        </div>
        <div class="control-divider"></div>
        <div class="control-block">
          <div class="control-row">
            <span class="control-label">Scale</span>
            <label class="toggle-switch">
              <input type="checkbox" ${layer.autoScale ? 'checked' : ''}
                onchange="setLayerProp(${layer.id},'autoScale',this.checked)">
              <span class="toggle-slider"></span>
            </label>
            <span class="auto-label">auto</span>
            <span style="flex:1"></span>
            <input type="number" class="num-input" min="0.01" max="999" step="0.01" value="${layer.scaleX.toFixed(2)}"
              onchange="(function(el){var v=Math.max(0.01,parseFloat(el.value)||0.01);el.value=v.toFixed(2);el.closest('.control-block').querySelector('input[type=range]').value=Math.min(4,v);setLayerProp(${layer.id},'scaleX',v);setLayerProp(${layer.id},'scaleY',v);setLayerProp(${layer.id},'autoScale',false)})(this)">
          </div>
          <input type="range" min="0.01" max="4" step="0.01" value="${layer.scaleX}" style="width:100%"
            oninput="(function(el){var v=parseFloat(el.value);el.closest('.control-block').querySelector('.num-input').value=v.toFixed(2);setLayerProp(${layer.id},'scaleX',v);setLayerProp(${layer.id},'scaleY',v);setLayerProp(${layer.id},'autoScale',false)})(this)">
        </div>
        <div class="control-divider"></div>
        <div class="control-row">
          <span class="control-label">Anim dir</span>
          <select onchange="setLayerProp(${layer.id},'animDir',parseInt(this.value))">
            <option value="1" ${layer.animDir===1?'selected':''}>CW ↻</option>
            <option value="-1" ${layer.animDir===-1?'selected':''}>CCW ↺</option>
          </select>
        </div>
        <div class="control-row">
          <span class="control-label">Anim speed</span>
          <input type="range" min="0.01" max="5" step="0.01" value="${layer.animSpeed}"
            oninput="setLayerProp(${layer.id},'animSpeed',parseFloat(this.value));this.nextElementSibling.value=parseFloat(this.value).toFixed(2)">
          <input type="number" class="num-input" min="0.01" max="999" step="0.01" value="${layer.animSpeed.toFixed(2)}"
            onchange="(function(el){var v=Math.max(0.01,parseFloat(el.value)||0.01);el.value=v.toFixed(2);el.previousElementSibling.value=Math.min(5,v);setLayerProp(${layer.id},'animSpeed',v)})(this)">
        </div>
        <div class="control-divider"></div>
        <div class="control-row">
          <span class="control-label">Color override</span>
          <input type="color" value="${layer.color || state.shapeColor}"
            oninput="setLayerProp(${layer.id},'color',this.value)">
          <button class="btn-icon" title="Reset to global" onclick="setLayerProp(${layer.id},'color',null)">↺</button>
        </div>
        <div class="control-divider"></div>
        <div class="control-row" style="justify-content:flex-end">
          <button class="btn-icon" title="Move up" onclick="moveLayer(${layer.id},-1)">↑</button>
          <button class="btn-icon" title="Move down" onclick="moveLayer(${layer.id},1)">↓</button>
          <button class="btn-icon" title="Duplicate" onclick="duplicateLayer(${layer.id})">⧉</button>
          <button class="btn-icon" title="Delete" onclick="deleteLayer(${layer.id})" style="color:#ff6b6b">✕</button>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleLayer(id) {
  const layer = state.layers.find(l => l.id === id);
  if (layer) { layer.open = !layer.open; buildLayerUI(); }
}

function setLayerProp(id, prop, value) {
  const layer = state.layers.find(l => l.id === id);
  if (layer) {
    layer[prop] = value;
    if (!state.animating) render();
    // Rebuild UI only for structural changes
    const structural = ['visible','autoStartAngle','autoItemRotation','autoScale','shapeId'];
    if (structural.includes(prop)) buildLayerUI();
  }
}

function moveLayer(id, dir) {
  const idx = state.layers.findIndex(l => l.id === id);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= state.layers.length) return;
  [state.layers[idx], state.layers[newIdx]] = [state.layers[newIdx], state.layers[idx]];
  buildLayerUI();
  render();
}

function duplicateLayer(id) {
  const idx = state.layers.findIndex(l => l.id === id);
  const copy = JSON.parse(JSON.stringify(state.layers[idx]));
  copy.id = ++layerIdCounter;
  copy.radius += 60;
  state.layers.splice(idx + 1, 0, copy);
  buildLayerUI();
  render();
}

function deleteLayer(id) {
  state.layers = state.layers.filter(l => l.id !== id);
  buildLayerUI();
  render();
}

// ============================================================
// Shapes UI
// ============================================================
function buildShapesUI() {
  const list = $('shapes-list');
  list.innerHTML = '';
  for (const sh of state.shapes) {
    const item = document.createElement('div');
    item.className = 'shape-item';
    item.innerHTML = `
      <div class="shape-preview">
        <svg viewBox="${sh.viewBox}" xmlns="http://www.w3.org/2000/svg">
          ${sh.svgContent}
        </svg>
      </div>
      <span class="shape-name">${sh.name}</span>
      <button class="btn-icon" onclick="deleteShape(${sh.id})">✕</button>
    `;
    list.appendChild(item);
  }
}

let shapeIdCounter = 0;

function parseSVG(text, name) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'image/svg+xml');
  const svgEl = doc.querySelector('svg');
  if (!svgEl) return null;

  // Get viewBox
  let vb = svgEl.getAttribute('viewBox');
  if (!vb) {
    const w = svgEl.getAttribute('width') || '100';
    const h = svgEl.getAttribute('height') || '100';
    vb = `0 0 ${parseFloat(w)} ${parseFloat(h)}`;
  }

  // Get inner content
  const content = svgEl.innerHTML;

  return { id: ++shapeIdCounter, name, svgContent: content, viewBox: vb };
}

function addShape(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const shape = parseSVG(e.target.result, file.name.replace(/\.svg$/i, ''));
    if (shape) {
      state.shapes.push(shape);
      buildShapesUI();
      buildLayerUI(); // update selects
    }
  };
  reader.readAsText(file);
}

function deleteShape(id) {
  state.shapes = state.shapes.filter(s => s.id !== id);
  // Reset any layer using this shape
  for (const layer of state.layers) {
    if (layer.shapeId === id) layer.shapeId = null;
  }
  buildShapesUI();
  buildLayerUI();
  render();
}

// ============================================================
// Export
// ============================================================
function exportSVG() {
  const wasAnimating = state.animating;
  if (wasAnimating) stopAnim();

  const svg = $('main-canvas');
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svg);
  // Ensure xmlns
  if (!svgStr.includes('xmlns=')) {
    svgStr = svgStr.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  }

  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'concentric-shape.svg';
  a.click();
  URL.revokeObjectURL(url);

  if (wasAnimating) startAnim();
}

function exportPNG() {
  const wasAnimating = state.animating;
  if (wasAnimating) stopAnim();

  render();
  const svg = $('main-canvas');
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svg);

  const img = new Image();
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);

  img.onload = () => {
    const canvas = document.createElement('canvas');
    const scale = 2; // 2× for retina
    canvas.width = state.canvasW * scale;
    canvas.height = state.canvasH * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    canvas.toBlob(pngBlob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      a.download = 'concentric-shape.png';
      a.click();
    });

    if (wasAnimating) startAnim();
  };
  img.src = url;
}

// ============================================================
// Init & event wiring
// ============================================================
function init() {
  // Default 3 layers
  for (let i = 0; i < 3; i++) {
    state.layers.push(createLayer(i));
    // Alternate anim direction
    state.layers[i].animDir = i % 2 === 0 ? 1 : -1;
  }

  buildShapesUI();
  buildLayerUI();
  render();

  // Canvas size
  $('canvas-w').addEventListener('change', e => {
    state.canvasW = parseInt(e.target.value) || 800;
    render();
  });
  $('canvas-h').addEventListener('change', e => {
    state.canvasH = parseInt(e.target.value) || 800;
    render();
  });

  // Colors
  $('bg-color').addEventListener('input', e => {
    state.bgColor = e.target.value;
    render();
  });
  $('shape-color').addEventListener('input', e => {
    state.shapeColor = e.target.value;
    render();
  });

  // File upload
  $('file-input').addEventListener('change', e => {
    for (const f of e.target.files) addShape(f);
    e.target.value = '';
  });

  // Drag & drop
  const dz = $('drop-zone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    for (const f of e.dataTransfer.files) {
      if (f.name.endsWith('.svg')) addShape(f);
    }
  });

  // Add layer
  $('add-layer-btn').addEventListener('click', () => {
    const idx = state.layers.length;
    const layer = createLayer(idx);
    layer.animDir = idx % 2 === 0 ? 1 : -1;
    state.layers.push(layer);
    buildLayerUI();
    render();
  });

  // Play/pause
  $('play-btn').addEventListener('click', () => {
    if (state.animating) stopAnim(); else startAnim();
  });

  // Global anim speed
  $('anim-speed').addEventListener('input', e => {
    state.animSpeed = parseFloat(e.target.value);
    $('speed-label').textContent = state.animSpeed.toFixed(1) + '×';
  });

  // Export
  $('export-btn').addEventListener('click', exportSVG);
  $('export-png-btn').addEventListener('click', exportPNG);
}

init();
</script>
</body>
</html>
